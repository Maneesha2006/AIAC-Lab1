<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Print Numbers</title>
</head>
<body>
    <pre id="output"></pre>

    <script>
        function printNumbers() {
            const out = document.getElementById('output');
            for (let i = 1; i <= 10; i++) {
                console.log(i);
                out.textContent += i + '\n';
            }
        }

        printNumbers();
    </script>
</body>
</html>
